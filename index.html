<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WORMHOLE-X - Multiverse Spaceship Explorer</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #01020a;
      color: #00f0ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Sci-Fi Flight Cockpit HUD */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }

    .hud-top {
      background: rgba(3, 10, 25, 0.85);
      border: 1px solid #00f0ff;
      border-radius: 10px;
      padding: 12px 15px;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-title {
      font-size: 14px;
      letter-spacing: 2px;
      color: #00f0ff;
      text-shadow: 0 0 8px #00f0ff;
    }

    .hud-metrics {
      font-size: 11px;
      text-align: right;
    }

    .val {
      color: #ff0077;
      font-weight: bold;
    }

    /* Mobile Touch Controls */
    .controls-grid {
      pointer-events: auto;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      max-width: 360px;
      margin: 0 auto;
      width: 100%;
    }

    .btn {
      background: rgba(0, 240, 255, 0.2);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      user-select: none;
    }

    .btn:active {
      background: #00f0ff;
      color: #01020a;
    }

    .btn-warp {
      grid-column: span 3;
      background: rgba(255, 0, 119, 0.25);
      border-color: #ff0077;
      color: #ff0077;
    }

    .btn-warp:active {
      background: #ff0077;
      color: #ffffff;
    }
  </style>

  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="webgl-container"></div>

  <div class="hud-overlay">
    <div class="hud-top">
      <div>
        <div class="hud-title">WORMHOLE-X // SPACESHIP</div>
        <div style="font-size: 9px; color: #72d6ff;">MULTIVERSE TRANSIT SYSTEM</div>
      </div>
      <div class="hud-metrics">
        <div>SPEED: <span class="val" id="speedVal">0.00 LY/s</span></div>
        <div>SECTOR: <span class="val" id="sectorVal">UNIVERSE-Alpha</span></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-grid">
      <div class="btn" id="btnLeft">◀ STEER L</div>
      <div class="btn" id="btnThrust">▲ THRUST</div>
      <div class="btn" id="btnRight">STEER R ▶</div>
      <div class="btn btn-warp" id="btnWarp">🌀 ENTER WORMHOLE WARP</div>
    </div>
  </div>

  <script>
    // 1. Scene, Camera & WebGL Renderer
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
    camera.position.set(0, 8, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 2. Lighting Setup
    const ambientLight = new THREE.AmbientLight(0x334466, 1.5);
    scene.add(ambientLight);

    const shipLight = new THREE.PointLight(0x00f0ff, 2, 100);
    scene.add(shipLight);

    // 3. Spaceship Player Model (Sleek Sci-Fi Cone Ship)
    const shipGroup = new THREE.Group();
    scene.add(shipGroup);

    const bodyGeo = new THREE.ConeGeometry(2, 6, 8);
    const bodyMat = new THREE.MeshPhongMaterial({ color: 0x00f0ff, wireframe: true });
    const shipBody = new THREE.Mesh(bodyGeo, bodyMat);
    shipBody.rotation.x = Math.PI / 2;
    shipGroup.add(shipBody);

    // Ship Wings
    const wingGeo = new THREE.BoxGeometry(7, 0.2, 2);
    const wingMat = new THREE.MeshBasicMaterial({ color: #ff0077, wireframe: true });
    const shipWings = new THREE.Mesh(wingGeo, wingMat);
    shipWings.position.z = 1;
    shipGroup.add(shipWings);

    // 4. Cosmological Bubble Universes
    const bubbles = [];
    function createMultiverseBubbles() {
      const bubbleColors = [0x00f0ff, 0xff0077, 0x9900ff, 0x00ff66, 0xffaa00];

      for (let i = 0; i < 15; i++) {
        const radius = 40 + Math.random() * 60;
        const geo = new THREE.SphereGeometry(radius, 24, 24);
        const mat = new THREE.MeshBasicMaterial({
          color: bubbleColors[i % bubbleColors.length],
          wireframe: true,
          transparent: true,
          opacity: 0.25
        });
        const bubble = new THREE.Mesh(geo, mat);

        bubble.position.set(
          (Math.random() - 0.5) * 1200,
          (Math.random() - 0.5) * 400,
          -200 - Math.random() * 1000
        );

        scene.add(bubble);
        bubbles.push(bubble);
      }
    }
    createMultiverseBubbles();

    // 5. Einstein-Rosen Wormhole Tunnel
    const wormholeGeo = new THREE.CylinderGeometry(25, 25, 800, 32, 60, true);
    const wormholeMat = new THREE.MeshBasicMaterial({ color: 0xff0077, wireframe: true, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
    const wormhole = new THREE.Mesh(wormholeGeo, wormholeMat);
    wormhole.rotation.x = Math.PI / 2;
    wormhole.position.set(0, 0, -1200);
    scene.add(wormhole);

    // 6. Starfield Space Dust
    const starGeo = new THREE.BufferGeometry();
    const starCount = 2000;
    const starCoords = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount * 3; i++) {
      starCoords[i] = (Math.random() - 0.5) * 2000;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starCoords, 3));
    const starMat = new THREE.PointsMaterial({ color: 0x00f0ff, size: 1.5, transparent: true, opacity: 0.8 });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    // 7. Flight Dynamics & Physics Loops
    let speed = 0;
    let turnAngle = 0;
    let isWarping = false;
    let activeSectorIndex = 0;
    const sectors = ["UNIVERSE-Alpha", "MULTIVERSE-Omega", "QUANTUM-REACH", "HYPER-BUBBLE-9"];

    // Navigation Key Listeners
    const keys = { left: false, right: false, thrust: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
      if (e.key === "ArrowUp" || e.key === "w") keys.thrust = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
      if (e.key === "ArrowUp" || e.key === "w") keys.thrust = false;
    });

    // Touch Controls Binding
    const bindTouch = (id, keyName) => {
      const btn = document.getElementById(id);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
      btn.addEventListener('mousedown', () => { keys[keyName] = true; });
      btn.addEventListener('mouseup', () => { keys[keyName] = false; });
    };

    bindTouch('btnLeft', 'left');
    bindTouch('btnRight', 'right');
    bindTouch('btnThrust', 'thrust');

    document.getElementById('btnWarp').addEventListener('click', triggerWarp);

    function triggerWarp() {
      if (isWarping) return;
      isWarping = true;
      speed = 12;

      // Sector Jump
      activeSectorIndex = (activeSectorIndex + 1) % sectors.length;
      document.getElementById('sectorVal').innerText = sectors[activeSectorIndex];

      setTimeout(() => {
        isWarping = false;
      }, 3000);
    }

    // 8. Main Game Loop
    function animate() {
      requestAnimationFrame(animate);

      // Steering Mechanics
      if (keys.left) {
        shipGroup.position.x -= 0.6;
        shipGroup.rotation.z = 0.3;
      } else if (keys.right) {
        shipGroup.position.x += 0.6;
        shipGroup.rotation.z = -0.3;
      } else {
        shipGroup.rotation.z *= 0.9;
      }

      // Thrust Mechanics
      if (keys.thrust) {
        speed = Math.min(speed + 0.1, 4.0);
      } else if (!isWarping) {
        speed = Math.max(speed - 0.05, 0.2);
      }

      // World Movement
      starField.position.z += speed * 3;
      if (starField.position.z > 500) starField.position.z = 0;

      wormhole.rotation.z += 0.01;
      wormhole.position.z += speed * 2;
      if (wormhole.position.z > 200) wormhole.position.z = -1200;

      // Rotate Bubble Universes
      bubbles.forEach(b => {
        b.rotation.y += 0.002;
        b.position.z += speed * 1.5;
        if (b.position.z > 300) b.position.z = -1000;
      });

      // Update Light & Camera Position
      shipLight.position.copy(shipGroup.position);
      camera.position.x = shipGroup.position.x * 0.5;

      // Update HUD
      document.getElementById('speedVal').innerText = `${(speed * 12.5).toFixed(2)} LY/s`;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
    </html>
